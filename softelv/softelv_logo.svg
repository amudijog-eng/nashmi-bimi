<?xml version="1.0" encoding="utf-8"?>
<svg version="1.2" baseProfile="tiny-ps" id="softelv_logo" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" xml:space="preserve">
<title>Softelv LLC Official Brand Mark</title>
<defs>
    <!-- Background Gradient -->
    <linearGradient id="softelvBgGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0e141d"/>
        <stop offset="50%" stop-color="#0a0f16"/>
        <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>

    <!-- Electric Blue Gradient -->
    <linearGradient id="blueRibbonGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#00b8d4"/>
        <stop offset="30%" stop-color="#0064e0"/>
        <stop offset="70%" stop-color="#0457cb"/>
        <stop offset="100%" stop-color="#7b3fe4"/>
    </linearGradient>

    <!-- Cyan Satellite Glow -->
    <linearGradient id="cyanDotGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38d9f5"/>
        <stop offset="100%" stop-color="#0064e0"/>
    </linearGradient>

    <!-- Violet Satellite Glow -->
    <linearGradient id="violetDotGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#9d67ff"/>
        <stop offset="100%" stop-color="#5522b5"/>
    </linearGradient>
</defs>

<!-- Outer Canvas -->
<rect width="512" height="512" rx="80" ry="80" fill="url(#softelvBgGrad)"/>
<rect width="504" height="504" x="4" y="4" rx="76" ry="76" fill="none" stroke="#1d2836" stroke-width="2"/>

<!-- Centered Softelv S-Emblem Scaled 4.2x -->
<!-- Original center was roughly (48, 48). We scale 4.4 and translate to center at (256, 256) -->
<g transform="translate(45, 45) scale(4.4)">
    <!-- Main S-Curve Ribbon -->
    <g transform="translate(0, -9)">
        <path d="M68 24H43.5C33.8 24 26 31.8 26 41.5S33.8 59 43.5 59h9C62.2 59 70 66.8 70 76.5S62.2 94 52.5 94H28"
              stroke="url(#blueRibbonGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>
    </g>
    <!-- Top Right Satellite Dot -->
    <circle cx="80" cy="12" r="6.5" fill="url(#cyanDotGrad)"/>
    <!-- Bottom Left Satellite Dot -->
    <circle cx="17" cy="80" r="5" fill="url(#violetDotGrad)"/>
</g>
</svg>
