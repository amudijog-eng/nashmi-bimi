             L 326 290 L 256 360 L 186 290 Z"
          fill="none" stroke="url(#goldGrad2)" stroke-width="18" stroke-linejoin="round"/>

    <path d="M 256 220 
             L 326 290 L 256 360 L 186 290 Z"
          fill="none" stroke="#2a1f0b" stroke-width="2" stroke-linejoin="round"/>

    <!-- Center 8-Ray Star of Jordan / Islamic Octagram -->
    <g id="center_star" fill="url(#goldHighlight)">
        <!-- Cardinal Points -->
        <polygon points="256,236 261,280 256,285 251,280"/>
        <polygon points="256,344 261,300 256,295 251,300"/>
        <polygon points="202,290 246,285 251,290 246,295"/>
        <polygon points="310,290 266,285 261,290 266,295"/>

        <!-- Diagonal Points -->
