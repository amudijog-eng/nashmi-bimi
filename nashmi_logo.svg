        <polygon points="294,328 262,298 258,294 264,292"/>
        <polygon points="294,252 262,282 258,286 264,288"/>
        <polygon points="218,328 250,298 254,294 248,292"/>
    </g>

    <!-- Star Core Facet Details -->
    <circle cx="256" cy="290" r="5" fill="#faecc8"/>
</g>
