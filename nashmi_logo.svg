<!-- Central Arab Geometric Golden Star Emblem -->
<g id="gold_emblem">
    <!-- Outer 8-Pointed Star Ornamental Frame (Extruded Gold Ribbon) -->
    <!-- Outer Contour -->
    <path d="M 256 160 
             L 282 178 L 318 168 L 332 202 L 368 214 L 360 250 L 388 274 L 366 304 L 380 338 L 344 354 L 342 392 L 306 392 L 290 424 L 256 410 L 222 424 L 206 392 L 170 392 L 168 354 L 132 338 L 146 304 L 124 274 L 152 250 L 144 214 L 180 202 L 194 168 L 230 178 Z"
