     xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" xml:space="preserve">
<title>Nashmi Official Brand Mark - Softelv LLC</title>
<defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#181a1f"/>
        <stop offset="50%" stop-color="#0e1014"/>
        <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>

    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldGrad1" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0%" stop-color="#f6e2b3"/>
        <stop offset="30%" stop-color="#d4af6a"/>
        <stop offset="65%" stop-color="#aa8343"/>
        <stop offset="100%" stop-color="#7e5c26"/>
    </linearGradient>

    <linearGradient id="goldGrad2" x1="0.8" y1="0" x2="0.2" y2="1">
        <stop offset="0%" stop-color="#faecc8"/>
        <stop offset="40%" stop-color="#cda35d"/>
        <stop offset="75%" stop-color="#946f32"/>
        <stop offset="100%" stop-color="#f0d59e"/>
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#dfbe76"/>
        <stop offset="50%" stop-color="#fff4d4"/>
        <stop offset="100%" stop-color="#b88f48"/>
    </linearGradient>

    <!-- Agal Rope Gradient -->
    <linearGradient id="agalGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2d3038"/>
        <stop offset="40%" stop-color="#141518"/>
        <stop offset="70%" stop-color="#0a0a0d"/>
        <stop offset="100%" stop-color="#1c1d22"/>
    </linearGradient>
</defs>

<!-- Dark Base Canvas with soft rounded frame -->
<rect width="512" height="512" rx="72" ry="72" fill="url(#bgGrad)"/>
<rect width="504" height="504" x="4" y="4" rx="68" ry="68" fill="none" stroke="#252932" stroke-width="2"/>

