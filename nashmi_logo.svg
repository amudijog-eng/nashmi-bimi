             L 274 208 L 300 200 L 310 226 L 336 235 L 330 262 L 350 280 L 334 302 L 344 326 L 318 338 L 316 366 L 290 366 L 278 388 L 256 378 L 234 388 L 222 366 L 196 366 L 194 338 L 168 326 L 178 302 L 162 280 L 182 262 L 176 235 L 202 226 L 212 200 L 238 208 Z"
          fill="#111317" stroke="#412f10" stroke-width="2" stroke-linejoin="round"/>

    <!-- Interlocking Diamond Frame Ribbon -->
